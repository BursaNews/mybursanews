  signup_link: https://start.moomoo.com/0Bpp3E
  promotions:
    - name: New Customer Promotion (standard Moomoo welcome rewards)
      status: active
      start: 2026-06-30 22:00 MYT
      end: 2026-10-09 21:59 MYT   # extended by Moomoo from 23/9/2026
