# BursaNews broker promotion source of truth
# ------------------------------------------------------------------
# Internal file. GitHub Pages (Jekyll) does not publish folders that
# start with an underscore, so visitors never see this file.
#
# HOW TO USE
# 1. Before changing any reward, fee or date on the site, update this
#    file first with the official source and the date you checked it.
# 2. Then search the repo for the old value and update every page
#    (title, meta description, og tags, JSON-LD, FAQ, tables, cards).
# 3. Status rules:
#      active     = official broker page confirms it is running today
#      expired    = stated end date has passed
#      unverified = no current official evidence; DO NOT show as current
# 4. Never extend an end date without official evidence.
# ------------------------------------------------------------------

last_full_audit: 2026-10-04

moomoo:
