  ipo_cds:
    detail: Moomoo help centre says a separate "CDS Account-IPO" is required for Malaysian IPO subscriptions (Accounts > More > CDS Account-IPO); usually processed in under 2 business days. Moomoo pricing lists RM0 IPO application fee.
    official_source: https://www.moomoo.com/my/support/topic9_214
    last_verified: 2026-10-04

