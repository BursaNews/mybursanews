      deposit_window: All deposits within 30 days of first deposit
      holding_period: 60 days net deposit maintained
      tiers:
        - deposit: RM1,000
          reward: RM100 total (1 x RM50 cash coupon + 2 x RM25 stock cash coupons)
        - deposit: RM3,000
          reward: + Apple fractional share worth RM100
        - deposit: RM10,000
          reward: + Apple fractional share worth RM300
        - deposit: RM40,000
          reward: + Apple fractional share worth RM1,000
      max_reward: RM1,500 (standard Moomoo campaign, not a BursaNews-exclusive amount)
      claim: Return to the campaign page and tap Claim within the campaign period
      official_source: https://www.moomoo.com/my/support/topic9_122
      last_verified: 2026-10-04
    - name: 180-day commission-free card (new users)
      status: active
      detail: 180 days commission-free, valid for US, MY, SG, HK and China A-shares, activated on each market account opening. Other fees (stamp duty, clearing, exchange/regulatory fees) still apply.
      official_source: https://www.moomoo.com/my/pricing
      last_verified: 2026-10-04
    - name: Cash Plus 6% p.a. new-user subsidy
      status: expired
      end: 2026-08-31
      official_source: https://www.moomoo.com/my/support/topic9_122
      note: Removed from all BursaNews pages.
  bursa88_benefit:
    status: requires_manual_verification
    claimed_on_site: Extra Apple shares worth RM50 (first deposit RM1,000) and RM100 (first deposit RM10,000), 60-day hold
    evidence: BursaNews own PDF guide (assets/moomoo-guide-bursa88.pdf). Not found on any public Moomoo page.
