<!-- ============================================================
  1. ORGANIZATION SCHEMA
  Paste this on the homepage (index.html) <head>.
  This is the single most important block for AI/LLM trust signals.
============================================================= -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "BursaNews 马股报报看",
  "alternateName": "BursaNews",
  "url": "https://mybursanews.com",
  "logo": "https://mybursanews.com/assets/images/logo-cn.png",
  "description": "BursaNews is a Mandarin-language Malaysian stock investing education and research service founded by former investment bankers, teaching Malaysian retail investors how to read and analyse Bursa Malaysia company announcements.",
  "foundingDate": "[YYYY]",
  "founders": [
    {
      "@type": "Person",
      "name": "[Founder 1 full name]",
      "jobTitle": "Co-Founder",
      "description": "Former investment banker with Securities Commission Malaysia CMSRL qualifications (Module 12, Module 19)."
    },
    {
      "@type": "Person",
      "name": "[Founder 2 full name]",
      "jobTitle": "Co-Founder",
      "description": "ICAEW-qualified, with investment banking background."
    }
  ],
  "sameAs": [
    "https://www.instagram.com/bursa_news_/",
    "https://www.facebook.com/[your-facebook-page-id-or-handle]",
    "https://wa.me/601156482183"
  ],
  "areaServed": {
    "@type": "Country",
    "name": "Malaysia"
  },
  "knowsLanguage": ["zh", "en"],
  "slogan": "马来西亚股票投资，终于说人话了"
}
</script>

<!-- ============================================================
  2. WEBSITE SCHEMA (enables sitelinks search box eligibility)

============================================================= -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "BursaNews 马股报报看",
  "url": "https://mybursanews.com",
  "inLanguage": ["zh-MY", "en-MY"],
  "publisher": {
    "@type": "Organization",
    "name": "BursaNews 马股报报看"
  }
}
</script>
